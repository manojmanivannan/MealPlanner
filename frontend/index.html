<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="icon" type="image/x-icon" href="/meal_logo.ico">
    <meta name="application-name" content="Meal Planner">
</head>
<body class="min-h-screen flex flex-col bg-canvas text-primary font-sans">
    <!-- Shared nav header + auth bootstrap injected here by src/layout.js -->
    <div id="app-header"></div>

    <main class="container mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 w-full max-w-7xl">
        <section>
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-primary">Weekly Planner</h1>
                    <p class="text-secondary mt-1 max-w-2xl">Plan five meal slots across the week and track macros per meal and per day.</p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="export-pdf-btn" type="button" class="mp-btn mp-btn-secondary focus-ring">
                        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v9m0 0l-3-3m3 3l3-3M4 14v2a1 1 0 001 1h10a1 1 0 001-1v-2"/></svg>
                        Export as PDF
                    </button>
                </div>
            </div>

            <!-- Planner grid + loading/empty/error states are rendered here by
                 src/pages/weekly-planner.js (token-driven .mp-* components). -->
            <div id="meal-plan-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
        </section>
    </main>

    <footer class="bg-sunken text-secondary py-8 text-center text-sm">
        <p>Your journey to healthy, convenient eating starts now.</p>
    </footer>

    <script type="module" src="/src/pages/weekly-planner.js"></script>
</body>
</html>
