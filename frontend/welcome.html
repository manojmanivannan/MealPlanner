<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome — MealPlanner</title>
    <link rel="icon" type="image/x-icon" href="/meal_logo.ico">
    <meta name="description" content="Sign in to your MealPlanner account to plan weekly meals, organize recipes, and manage ingredients.">
    <meta name="application-name" content="Meal Planner">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-canvas text-primary font-sans relative overflow-hidden">
    <!-- Subtle geometric backdrop elements -->
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-accent/5 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-blue-500/5 blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md bg-surface rounded-2xl shadow-xl p-8 border border-line relative z-10">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-accent text-accent-fg flex items-center justify-center mx-auto mb-3 shadow-md">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
                    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
                    <line x1="6" y1="1" x2="6" y2="4"/>
                    <line x1="10" y1="1" x2="10" y2="4"/>
                    <line x1="14" y1="1" x2="14" y2="4"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-primary">MealPlanner</h1>
            <p class="text-secondary text-sm mt-1">Smart Weekly Nutrition &amp; Recipe Planner</p>
        </div>

        <!-- Pill Tabs for Login / Sign Up -->
        <div class="mp-pill-tabs w-full flex mb-6 p-1 bg-subtle rounded-xl border border-line">
            <button id="tab-login" type="button" class="mp-pill-tab flex-1 text-center py-2 active">Sign In</button>
            <button id="tab-signup" type="button" class="mp-pill-tab flex-1 text-center py-2">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div class="mp-field">
                <label for="login-email" class="mp-label">Email Address</label>
                <div class="relative">
                    <input id="login-email" type="email" required class="mp-input pl-9 focus-ring" placeholder="you@example.com" value="demo@demo.com">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M3 6l7 5 7-5"/></svg>
                </div>
            </div>
            <div class="mp-field">
                <label for="login-password" class="mp-label">Password</label>
                <div class="relative">
                    <input id="login-password" type="password" required class="mp-input pl-9 focus-ring" placeholder="••••••••" value="demo">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="9" width="12" height="9" rx="2"/><path d="M7 9V5a3 3 0 0 1 6 0v4"/></svg>
                </div>
            </div>

            <div id="login-error" class="text-xs text-[var(--color-danger)] min-h-[1rem]"></div>

            <button id="login-submit-btn" class="mp-btn mp-btn-primary mp-btn-block py-2.5 shadow-md focus-ring" type="submit">Sign In</button>

            <!-- Quick Demo Button -->
            <button id="quick-demo-btn" type="button" class="w-full text-center text-xs text-muted hover:text-accent font-medium py-1.5 transition-colors">
                Use Demo Account (demo@demo.com)
            </button>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="space-y-4 hidden">
            <div class="mp-field">
                <label for="signup-email" class="mp-label">Email Address</label>
                <div class="relative">
                    <input id="signup-email" type="email" required class="mp-input pl-9 focus-ring" placeholder="you@example.com">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M3 6l7 5 7-5"/></svg>
                </div>
            </div>
            <div class="mp-field">
                <label for="signup-password" class="mp-label">Choose Password</label>
                <div class="relative">
                    <input id="signup-password" type="password" required class="mp-input pl-9 focus-ring" placeholder="••••••••">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="9" width="12" height="9" rx="2"/><path d="M7 9V5a3 3 0 0 1 6 0v4"/></svg>
                </div>
            </div>

            <div id="signup-error" class="text-xs text-[var(--color-danger)] min-h-[1rem]"></div>

            <button id="signup-submit-btn" class="mp-btn mp-btn-primary mp-btn-block py-2.5 shadow-md focus-ring" type="submit">Create Account</button>
        </form>
    </div>

    <script type="module" src="/src/pages/welcome.js"></script>
</body>
</html>
