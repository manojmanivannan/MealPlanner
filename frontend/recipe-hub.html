<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Hub</title>
    <link rel="icon" type="image/x-icon" href="/meal_logo.ico">
    <meta name="application-name" content="Meal Planner">
</head>
<body class="min-h-screen flex flex-col bg-canvas text-primary font-sans">
    <!-- Shared nav header + auth bootstrap injected here by src/layout.js -->
    <div id="app-header"></div>

    <main class="container mx-auto px-6 py-12 flex-1">
        <section>
            <h3 class="text-2xl md:text-3xl font-bold clay-title mb-2 text-center">Recipe &amp; Prep Hub</h3>
            <p class="max-w-3xl mx-auto text-lg text-secondary mt-2 text-center mb-10">
                Select a tab below to explore quick recipes and batch cooking strategies.
            </p>
            <div class="bg-surface p-4 sm:p-6 rounded-xl shadow-md border border-line clay-section">
                <nav class="flex flex-wrap -mb-px mb-6" id="hub-tabs">
                    <button class="hub-tab whitespace-nowrap py-2 px-2 border-b-2 font-medium text-sm clay-btn">☕ Pre-Breakfast</button>
                    <button class="hub-tab active-tab whitespace-nowrap py-2 px-2 border-b-2 font-medium text-sm clay-btn">🍳 Breakfast</button>
                    <button class="hub-tab whitespace-nowrap py-2 px-2 border-b-2 font-medium text-sm clay-btn">🍲 Lunch &amp; Dinner</button>
                    <button class="hub-tab whitespace-nowrap py-2 px-2 border-b-2 font-medium text-sm clay-btn">🥜 Snacks</button>
                    <button class="hub-tab whitespace-nowrap py-2 px-2 border-b-2 font-medium text-sm clay-btn">🥗 Sides</button>
                    <button class="hub-tab whitespace-nowrap py-2 px-2 border-b-2 font-medium text-sm clay-btn">🗓️ Weekend Prep</button>
                </nav>
                <div id="hub-content"></div>
            </div>
        </section>
    </main>

    <footer class="bg-sunken text-secondary py-8 text-center">
        <p>Explore recipes and batch cooking strategies.</p>
    </footer>

    <script type="module" src="/src/pages/recipe-hub.js"></script>
</body>
</html>
