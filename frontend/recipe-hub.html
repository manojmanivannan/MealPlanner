<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Hub — MealPlanner</title>
    <link rel="icon" type="image/x-icon" href="/meal_logo.ico">
    <meta name="description" content="Browse, manage, and create delicious recipes and batch prep meals with dynamic nutritional tracking.">
    <meta name="application-name" content="Meal Planner">
</head>
<body class="min-h-screen flex flex-col bg-canvas text-primary font-sans">
    <!-- Shared nav header injected by layout.js -->
    <div id="app-header"></div>

    <main class="container mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full max-w-7xl">
        <section>
            <!-- Page Header -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-6 border-b border-line mb-6">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="mp-badge mp-badge-accent">Recipe Library</span>
                        <span id="recipe-count-badge" class="text-xs font-semibold text-muted">Loading...</span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-primary">Recipe &amp; Prep Hub</h1>
                    <p class="text-secondary text-sm mt-1 max-w-2xl">Explore healthy recipes by meal category, customize ingredients, and seamlessly assign to your weekly schedule.</p>
                </div>
                <div class="flex items-center gap-2.5">
                    <button id="add-recipe-btn" type="button" class="mp-btn mp-btn-primary focus-ring">
                        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
                        Create Recipe
                    </button>
                </div>
            </div>

            <!-- Toolbar: Search + Diet Filter -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
                <div class="relative flex-1 max-w-md">
                    <label for="recipe-search" class="sr-only">Search recipes</label>
                    <input id="recipe-search" type="search" class="mp-input pl-9 pr-12 focus-ring" placeholder="Search recipes or ingredients..." autocomplete="off">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l3 3"/></svg>
                    <kbd class="hidden sm:inline-block absolute right-3 top-1/2 -translate-y-1/2 text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-subtle border border-line text-muted font-bold">/</kbd>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-xs font-medium text-muted uppercase tracking-wider">Diet:</span>
                    <div id="diet-filter-pills" class="mp-pill-tabs" role="group" aria-label="Dietary filter">
                        <button type="button" class="mp-pill-tab active" data-diet="both">All</button>
                        <button type="button" class="mp-pill-tab" data-diet="veg">Vegetarian</button>
                        <button type="button" class="mp-pill-tab" data-diet="nonveg">Non-Veg</button>
                    </div>
                </div>
            </div>

            <!-- Category Tablist -->
            <div id="hub-tabs" class="mp-tablist" role="tablist" aria-label="Recipe categories"></div>

            <!-- Recipe Grid -->
            <div id="recipe-grid" role="tabpanel" aria-labelledby="hub-tabs" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 pt-6"></div>
        </section>
    </main>

    <footer class="bg-surface border-t border-line text-secondary py-6 text-center text-xs mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="text-muted">MealPlanner • Material Flat Minimalist Nutrition Experience</p>
            <div class="flex items-center gap-4 text-muted">
                <a href="index.html" class="hover:text-primary transition-colors">Planner</a>
                <a href="ingredients.html" class="hover:text-primary transition-colors">Ingredients</a>
                <a href="shopping-list.html" class="hover:text-primary transition-colors">Shopping</a>
                <a href="catalog.html" class="hover:text-primary transition-colors">Components</a>
            </div>
        </div>
    </footer>

    <script type="module" src="/src/pages/recipe-hub.js"></script>
</body>
</html>
