<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Hub</title>
    <link rel="icon" type="image/x-icon" href="/meal_logo.ico">
    <meta name="application-name" content="Meal Planner">
</head>
<body class="min-h-screen flex flex-col bg-canvas text-primary font-sans">
    <!-- Shared nav header + auth bootstrap injected here by src/layout.js -->
    <div id="app-header"></div>

    <main class="container mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 w-full max-w-7xl">
        <section>
            <div class="mb-6">
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-primary">Recipe &amp; Prep Hub</h1>
                <p class="text-secondary mt-1 max-w-2xl">Browse recipes by category, then edit, delete, or assign them to your weekly plan. Sides and Weekend Prep live here only — they have no planner slot.</p>
            </div>

            <!-- Toolbar: stable in the DOM so the search input keeps focus while
                 typing (the grid below re-renders; this row never does). -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
                <div class="flex items-center gap-3 flex-wrap">
                    <button id="add-recipe-btn" type="button" class="mp-btn mp-btn-primary focus-ring">
                        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
                        Add Recipe
                    </button>
                    <div class="relative">
                        <label for="recipe-search" class="sr-only">Search recipes</label>
                        <input id="recipe-search" type="search" class="mp-input pl-9 focus-ring" placeholder="Search by name…" autocomplete="off">
                        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l3 3"/></svg>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <label for="veg-filter" class="text-sm text-secondary">Diet</label>
                    <select id="veg-filter" class="mp-select focus-ring w-auto">
                        <option value="both">All</option>
                        <option value="veg">Vegetarian</option>
                        <option value="nonveg">Non-Veg</option>
                    </select>
                </div>
            </div>

            <!-- Category tablist — wired by src/pages/recipe-hub.js with the
                 same arrow-key + roving-tabindex pattern the catalog uses. -->
            <div id="hub-tabs" class="mp-tablist" role="tablist" aria-label="Recipe categories"></div>

            <!-- Recipe grid + loading/empty/error states are rendered here by
                 src/pages/recipe-hub.js (token-driven .mp-* components). -->
            <div id="recipe-grid" role="tabpanel" aria-labelledby="hub-tabs" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 pt-6"></div>
        </section>
    </main>

    <footer class="bg-sunken text-secondary py-8 text-center text-sm">
        <p>Explore recipes and batch cooking strategies.</p>
    </footer>

    <script type="module" src="/src/pages/recipe-hub.js"></script>
</body>
</html>
