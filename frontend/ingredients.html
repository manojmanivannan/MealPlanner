<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredients</title>
    <link rel="icon" type="image/x-icon" href="/meal_logo.ico">
    <meta name="application-name" content="Meal Planner">
</head>
<body class="min-h-screen flex flex-col bg-canvas text-primary font-sans">
    <!-- Shared nav header + auth bootstrap injected here by src/layout.js -->
    <div id="app-header"></div>

    <main class="container mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 w-full max-w-7xl">
        <section>
            <div class="mb-6">
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-primary">Ingredients</h1>
                <p class="text-secondary mt-1 max-w-2xl">Your pantry and ingredient library. Toggle what's in the pantry, add new ingredients, and edit nutrition per serving.</p>
            </div>

            <!-- Toolbar: stable in the DOM so the search input keeps focus while
                 typing (the grid below re-renders; this row never does). -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
                <div class="flex items-center gap-3 flex-wrap">
                    <button id="add-ingredient-btn" type="button" class="mp-btn mp-btn-primary focus-ring">
                        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
                        Add Ingredient
                    </button>
                    <div class="relative">
                        <label for="ingredient-search" class="sr-only">Search ingredients</label>
                        <input id="ingredient-search" type="search" class="mp-input pl-9 focus-ring" placeholder="Search by name…" autocomplete="off">
                        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l3 3"/></svg>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <label for="sort-select" class="text-sm text-secondary">Sort</label>
                    <select id="sort-select" class="mp-select focus-ring w-auto">
                        <option value="name">A–Z</option>
                        <option value="shelf">Shelf life</option>
                    </select>
                </div>
            </div>

            <!-- Ingredient grid + loading/empty/error states are rendered here
                 by src/pages/ingredients.js (token-driven .mp-* components). -->
            <div id="ingredient-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pt-2"></div>
        </section>
    </main>

    <footer class="bg-sunken text-secondary py-8 text-center text-sm">
        <p>Manage your ingredients efficiently.</p>
    </footer>

    <script type="module" src="/src/pages/ingredients.js"></script>
</body>
</html>
