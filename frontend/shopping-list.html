<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List — Meal Planner</title>
    <link rel="icon" type="image/x-icon" href="/meal_logo.ico">
    <meta name="application-name" content="Meal Planner">
</head>
<body class="min-h-screen flex flex-col bg-canvas text-primary font-sans">
    <!-- Shared nav header + auth bootstrap injected here by src/layout.js -->
    <div id="app-header"></div>

    <main class="container mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-1 w-full max-w-3xl">
        <section>
            <div class="mb-6">
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-primary">Shopping List</h1>
                <p class="text-secondary mt-1 max-w-2xl">What you need to buy for this week's plan — aggregated across every planned recipe, minus what's already in your pantry. Check items off as you shop.</p>
            </div>

            <!-- Toolbar: stable in the DOM so the search input keeps focus while
                 the list below re-renders. -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <div class="relative flex-1 max-w-sm">
                    <label for="shopping-search" class="sr-only">Search shopping list</label>
                    <input id="shopping-search" type="search" class="mp-input pl-9 focus-ring" placeholder="Search items…" autocomplete="off">
                    <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l3 3"/></svg>
                </div>
                <div class="flex items-center gap-4">
                    <label class="mp-switch">
                        <input type="checkbox" id="hide-purchased">
                        <span class="mp-switch-track" aria-hidden="true"></span>
                        <span class="text-sm text-secondary">Hide checked</span>
                    </label>
                    <button id="uncheck-all" type="button" class="mp-btn mp-btn-ghost mp-btn-sm focus-ring" disabled>Reset</button>
                </div>
            </div>

            <!-- Progress summary + bar, rendered by src/pages/shopping-list.js. -->
            <div id="shopping-progress" class="mb-4"></div>

            <!-- The list + loading/empty/error states are rendered here by
                 src/pages/shopping-list.js (token-driven .mp-* components). -->
            <div id="shopping-list" class="mp-card"></div>
        </section>
    </main>

    <footer class="bg-sunken text-secondary py-8 text-center text-sm">
        <p>Your week's shopping, generated from your plan.</p>
    </footer>

    <script type="module" src="/src/pages/shopping-list.js"></script>
</body>
</html>
