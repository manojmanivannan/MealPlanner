<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List — MealPlanner</title>
    <link rel="icon" type="image/x-icon" href="/meal_logo.ico">
    <meta name="description" content="Aggregated shopping grocery list generated automatically from your weekly planned recipes.">
    <meta name="application-name" content="Meal Planner">
</head>
<body class="min-h-screen flex flex-col bg-canvas text-primary font-sans">
    <!-- Shared nav header injected by layout.js -->
    <div id="app-header"></div>

    <main class="container mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full max-w-4xl">
        <section>
            <!-- Page Header -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-6 border-b border-line mb-6">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="mp-badge mp-badge-accent">Smart Grocery</span>
                        <span id="shopping-count-badge" class="text-xs font-semibold text-muted">Calculating...</span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-primary">Weekly Shopping List</h1>
                    <p class="text-secondary text-sm mt-1 max-w-2xl">Automatically aggregated from this week's planned meals minus pantry items in stock. Check items off as you shop.</p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="copy-list-btn" type="button" class="mp-btn mp-btn-secondary focus-ring" title="Copy shopping list to clipboard">
                        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="9" height="9" rx="1.5"/><path d="M4 13V4a1 1 0 011-1h9"/></svg>
                        Copy List
                    </button>
                </div>
            </div>

            <!-- Toolbar: Search + Hide Checked + Reset -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <div class="relative flex-1 max-w-sm">
                    <label for="shopping-search" class="sr-only">Search shopping list</label>
                    <input id="shopping-search" type="search" class="mp-input pl-9 focus-ring" placeholder="Filter items..." autocomplete="off">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l3 3"/></svg>
                </div>
                <div class="flex items-center gap-4">
                    <label class="mp-switch">
                        <input type="checkbox" id="hide-purchased">
                        <span class="mp-switch-track" aria-hidden="true"></span>
                        <span class="text-xs font-medium text-secondary">Hide Checked</span>
                    </label>
                    <button id="uncheck-all" type="button" class="mp-btn mp-btn-ghost mp-btn-xs focus-ring text-secondary" disabled>Uncheck All</button>
                </div>
            </div>

            <!-- Progress summary card -->
            <div id="shopping-progress" class="mb-4"></div>

            <!-- Shopping List container -->
            <div id="shopping-list" class="mp-card p-0 overflow-hidden"></div>
        </section>
    </main>

    <footer class="bg-surface border-t border-line text-secondary py-6 text-center text-xs mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="text-muted">MealPlanner • Material Flat Minimalist Nutrition Experience</p>
            <div class="flex items-center gap-4 text-muted">
                <a href="index.html" class="hover:text-primary transition-colors">Planner</a>
                <a href="recipe-hub.html" class="hover:text-primary transition-colors">Recipes</a>
                <a href="ingredients.html" class="hover:text-primary transition-colors">Ingredients</a>
                <a href="catalog.html" class="hover:text-primary transition-colors">Components</a>
            </div>
        </div>
    </footer>

    <script type="module" src="/src/pages/shopping-list.js"></script>
</body>
</html>
